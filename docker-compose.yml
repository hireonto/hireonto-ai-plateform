services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hiremind
      POSTGRES_PASSWORD: hiremind
      POSTGRES_DB: hiremind
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hiremind -d hiremind']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/hiremind || true;
      exit 0;
      "

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  judge0-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      POSTGRES_DB: judge0
    volumes:
      - judge0_db:/var/lib/postgresql/data

  judge0-redis:
    image: redis:7-alpine

  judge0:
    image: judge0/judge0:latest
    depends_on:
      - judge0-db
      - judge0-redis
    environment:
      REDIS_HOST: judge0-redis
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
    ports:
      - '2358:2358'

  hiremind-ai:
    image: ghcr.io/hiremind/hiremind-ai:latest
    profiles: ['full']
    environment:
      AI_FAKE_MODE: 'true'
    ports:
      - '8000:8000'

  hiremind-backend:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ['full']
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3001:3001'

  hiremind-frontend:
    image: ghcr.io/hiremind/hiremind-frontend:latest
    profiles: ['full']
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  minio_data:
  judge0_db:
